      clearInterval(retryTimer);
      retryTimer = null;
    }
    removeUnlockListeners();
  }

  function tryAutoPlay() {
    if (userStopped) return;
    if (!audio.paused && !audio.muted) {
      updateState(true);
      stopRetries();
      return;
    }
    audio.muted = false;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx && !window.__bgAudioCtx) {
        window.__bgAudioCtx = new AudioCtx();
      }
      if (window.__bgAudioCtx && window.__bgAudioCtx.state === "suspended") {
        window.__bgAudioCtx.resume().catch(function() {});
      }
    } catch (e) {}
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(function() {
        updateState(true);
        stopRetries();
      }).catch(function() {});
    }
  }

  const unlockEvents = [
    "click", "dblclick", "contextmenu",
    "touchstart", "touchend", "touchmove",
    "pointerdown", "pointerup", "pointermove",
    "mousedown", "mouseup", "mousemove", "mouseenter", "mouseover",
    "keydown", "keyup", "wheel", "scroll", "focus"
  ];
  function onFirstInteraction(e) {
    if (e && e.target && btn.contains(e.target)) return;
    tryAutoPlay();
  }
  function removeUnlockListeners() {
    unlockEvents.forEach(function(evt) {
      window.removeEventListener(evt, onFirstInteraction, true);
      document.removeEventListener(evt, onFirstInteraction, true);
    });
  }
  unlockEvents.forEach(function(evt) {
    window.addEventListener(evt, onFirstInteraction, { capture: true, passive: true });
    document.addEventListener(evt, onFirstInteraction, { capture: true, passive: true });
  });

  audio.addEventListener("loadedmetadata", tryAutoPlay);
  audio.addEventListener("loadeddata", tryAutoPlay);
  audio.addEventListener("canplay", tryAutoPlay);
  audio.addEventListener("canplaythrough", tryAutoPlay);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", tryAutoPlay);
  } else {
    tryAutoPlay();
  }
  window.addEventListener("load", tryAutoPlay);
  window.addEventListener("pageshow", tryAutoPlay);
  document.addEventListener("visibilitychange", function() {
    if (!document.hidden) tryAutoPlay();
  });

  retryTimer = setInterval(function() {
    if (userStopped || (!audio.paused && !audio.muted)) {
      stopRetries();
      return;
    }
    tryAutoPlay();
  }, 300);

  tryAutoPlay();

  btn.addEventListener("click", function(e) {
    e.stopPropagation();
    stopRetries();
    if (audio.paused) {
      userStopped = false;
      audio.muted = false;
      audio.play().then(function() {
        updateState(true);
      }).catch(function(err) {
        console.error("Audio play error:", err);
      });
    } else {
      userStopped = true;
      audio.pause();
      audio.currentTime = 0;
      updateState(false);
    }
  });

  audio.addEventListener("play", function() { updateState(true); });
  audio.addEventListener("playing", function() { updateState(true); });
  audio.addEventListener("pause", function() { updateState(false); });
  audio.addEventListener("ended", function() { updateState(false); });
})();
</script>

(function() {

  const SCROLL_STEP_GROUPS = [

    [

    ]
  ];

  function updateScrollStepAnimations() {
    const vh = window.innerHeight || document.documentElement.clientHeight || 800;
    const topThreshold = vh * 0.06;
    const bottomThreshold = vh * 0.93;

    SCROLL_STEP_GROUPS.forEach(function(group) {
      // Determine group visibility based on the group's bounding box or individual step rects
      group.forEach(function(step) {
        let primaryEl = null;
        for (let i = 0; i < step.ids.length; i++) {
          const candidate = document.getElementById(step.ids[i]);
          if (candidate) {
            primaryEl = candidate;
            break;
          }
        }
        if (!primaryEl) return;

        const rect = primaryEl.getBoundingClientRect();
        if (rect.width === 0 && rect.height === 0) return;

        const centerY = rect.top + rect.height * 0.5;
        let state = "visible";
        if (centerY > bottomThreshold) {
          state = "below";
        } else if (centerY < topThreshold) {
          state = "above";
        }

        step.ids.forEach(function(id) {
          const el = document.getElementById(id);
          if (!el) return;
          const wrap = el.querySelector(":scope > .canva-pendulum-wrap") || el.firstElementChild;
          if (!wrap) return;

          if (!wrap.classList.contains("scroll-step-item")) {
            wrap.classList.add("scroll-step-item");
          }

          if (state === "visible") {
            if (!wrap.classList.contains("scroll-step-visible")) {
              wrap.style.transitionDelay = step.delayIn + "ms";
              wrap.classList.remove("scroll-step-below", "scroll-step-above");
              wrap.classList.add("scroll-step-visible");
            }
          } else if (state === "below") {
            if (!wrap.classList.contains("scroll-step-below")) {
              wrap.style.transitionDelay = "0ms";
              wrap.classList.remove("scroll-step-visible", "scroll-step-above");
              wrap.classList.add("scroll-step-below");
            }
          } else if (state === "above") {
            if (!wrap.classList.contains("scroll-step-above")) {
              wrap.style.transitionDelay = "0ms";
              wrap.classList.remove("scroll-step-visible", "scroll-step-below");
              wrap.classList.add("scroll-step-above");
            }
          }
        });
      });
    });
  }

  let scrollRafPending = false;
  function onScrollOrResize() {
    if (scrollRafPending) return;
    scrollRafPending = true;

      scrollRafPending = false;
      updateScrollStepAnimations();
    });
  }

  try {
    localStorage.removeItem("kseniya_reserved_gifts_v1");
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (Array.isArray(saved)) {
      saved.forEach(function(id) {
        if (!MULTI_SELECT_IDS.has(id)) {
          reservedGiftIds.add(id);
        }
      });
    }
  } catch (e) {}

  function syncReservedStyles() {
    const styleEl = document.getElementById("gift-reserved-styles");
    if (!styleEl) return;
    const rules = [];
    GIFTS.forEach(function(gift) {
      if (!gift.multiSelect && !MULTI_SELECT_IDS.has(gift.id) && reservedGiftIds.has(gift.id)) {
        rules.push(
          "#" + gift.imageId + ", #" + gift.groupId + ", #" + gift.shapeId + ", #" + gift.textId + " {" +
          " filter: grayscale(100%) opacity(0.52) !important;" +
          " -webkit-filter: grayscale(100%) opacity(0.52) !important;" +

          "}"
        );
      }
    });
    styleEl.textContent = rules.join("\n");
  }

  function markGiftReserved(giftId) {
    if (!giftId || MULTI_SELECT_IDS.has(giftId)) return;
    reservedGiftIds.add(giftId);

      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(reservedGiftIds)));
    } catch (e) {}
    syncReservedStyles();
  }

  function fetchReservedGiftsFromServer() {
    fetch("/kseniya/api/gifts", { method: "GET", cache: "no-store" })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(data) {
        const list = data && (data.reserved || data.reserved_gifts);
        if (Array.isArray(list)) {
          reservedGiftIds.clear();
          list.forEach(function(id) {
            if (!MULTI_SELECT_IDS.has(id)) {
              reservedGiftIds.add(id);

          });
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(reservedGiftIds)));
          } catch (e) {}
          syncReservedStyles();
        }
      })
      .catch(function() {});
  }

  syncReservedStyles();
  fetchReservedGiftsFromServer();

  const errorBox = document.getElementById("gift-modal-error");
  const yesBtn = document.getElementById("gift-btn-yes");

  const thanksOkBtn = document.getElementById("gift-btn-thanks-ok");

  let isSubmitting = false;

  function openGiftModal(gift) {
    if (!gift || (!gift.multiSelect && !MULTI_SELECT_IDS.has(gift.id) && reservedGiftIds.has(gift.id))) return;
    activeGift = gift;
    isSubmitting = false;
    nameInput.value = "";
    relationInput.value = "";
    errorBox.classList.remove("visible");
    formView.style.display = "block";

  });

          closeGiftModal();
        }

    e.stopPropagation();
    submitGiftResponse("Да");
  });

  noBtn.addEventListener("click", function(e) {
    e.stopPropagation();
    submitGiftResponse("Нет");
  });

  // Intercept clicks on any of the 6 "Подарить" buttons
  document.addEventListener("click", function(e) {
    if (!e || !e.target || typeof e.target.closest !== "function") return;
    for (let i = 0; i < GIFTS.length; i++) {
      const g = GIFTS[i];
      const selector = "#" + g.groupId + ", #" + g.shapeId + ", #" + g.textId;

      if (matched) {

        e.stopPropagation();

          return;
        }

        return;
      }
    }
  }, true);
})();
